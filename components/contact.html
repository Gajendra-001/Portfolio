<section class="py-32 bg-[#f8f7ff]">
  <div class="max-w-6xl mx-auto px-8 grid grid-cols-1 md:grid-cols-2 gap-20 items-center">

    <!-- Animation -->
    <div class="flex justify-center">
      <img
        src="https://assets.dochipo.com/editor/animations/social-media/2d7cba36-930e-4401-84a3-7877b6bbfc6d.gif"
        alt="Contact Us Animation"
        class="w-full max-w-md h-auto pb-20"
      />
    </div>

    <!-- Form -->
    <div class="flex flex-col">
      <div class="mb-8">
        <h2 class="text-5xl font-bold text-black leading-tight">
          Get in touch
        </h2>
      </div>

      <form class="space-y-4">

        <div class="flex flex-col md:flex-row gap-4">
          <input
            type="text"
            placeholder="Name"
            class="w-full px-4 py-4 rounded-xl bg-white border border-[#e6e4ff]
                   text-gray-700 placeholder-gray-400
                   focus:ring-2 focus:ring-[#c7c3ff] outline-none"
            required
          />

          <input
            type="email"
            placeholder="Email"
            class="w-full px-4 py-4 rounded-xl bg-white border border-[#e6e4ff]
                   text-gray-700 placeholder-gray-400
                   focus:ring-2 focus:ring-[#c7c3ff] outline-none"
            required
          />
        </div>

        <input
          type="text"
          placeholder="Subject (Optional)"
          class="w-full px-4 py-4 rounded-xl bg-white border border-[#e6e4ff]
                 text-gray-700 placeholder-gray-400
                 focus:ring-2 focus:ring-[#c7c3ff] outline-none"
        />

        <textarea
          placeholder="Message"
          class="w-full px-4 py-4 rounded-xl bg-white border border-[#e6e4ff]
                 text-gray-700 placeholder-gray-400
                 focus:ring-2 focus:ring-[#c7c3ff] outline-none
                 h-40 resize-none"
          required
        ></textarea>

        <button
          type="submit"
          class="w-1/2 mt-4 py-4 rounded-full bg-black text-white
                 hover:bg-gray-800 transition font-medium"
        >
          Send Message
        </button>
      </form>

  </div>
</section>
